plugins {
    id 'com.android.application'
}

android {
    namespace 'app.chessvision.trainer'
    compileSdk 34

    defaultConfig {
        applicationId "app.chessvision.trainer"
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

